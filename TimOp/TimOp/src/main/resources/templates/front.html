<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Main Page</title>
    <style>
        body {
          display: flex;
          flex-direction: column;  /* 세로 배치 */
          justify-content: center;
          align-items: center;
          height: 100vh;
          margin: 0;
          background: #fafafa;
          font-family: Arial, sans-serif;
          gap: 2rem;               /* 섹션 사이 간격 */
        }

        /* 상단 헤더 */
        .header {
          display: flex;
          align-items: center;
          gap: 1rem;
        }

        h1 {
          margin: 0;
          font-size: 2rem;
          color: #333;
        }

        .header button {
          padding: 0.6rem 1.2rem;
          border: none;
          border-radius: 4px;
          background: #4a90e2;
          color: #fff;
          cursor: pointer;
          transition: background 0.2s;
        }
        .header button:hover {
          background: #357abd;
        }

        /* 소셜 로그인 버튼 그룹 */
        .social-login {
          display: flex;
          gap: 10px;
        }

        .btn-kakao {
          background-color: #FEE500;
          color: #000000;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 16px;
          border-radius: 4px;
          font-weight: bold;
          text-decoration: none;
        }
        .btn-kakao img {
          width: 18px;
          height: 18px;
        }

        .btn-google {
          background-color: #ffffff;
          border: 1px solid #dadce0;
          color: #3c4043;
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 10px 16px;
          border-radius: 4px;
          font-weight: 500;
          text-decoration: none;
        }
        .btn-google img {
          width: 18px;
          height: 18px;
        }
    </style>
</head>
<body>
<!-- 상단 헤더 -->
<div class="header">
    <h1>TimOp</h1>
    <button onclick="location.href='/login'">로그인</button>
    <button onclick="location.href='/join'">회원가입</button>
</div>

<!-- 소셜 로그인 -->
<div class="social-login">
    <a href="/auth/login/google" class="btn-google">
        <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google" />
        구글 계정으로 로그인
    </a>
    <a href="/auth/login/kakao" class="btn-kakao">
        <img src="https://developers.kakao.com/tool/resource/static/img/button/login/full/ko/kakao_login_medium_narrow.png" alt="Kakao" />
        카카오 계정으로 로그인
    </a>
</div>
</body>
</html>
